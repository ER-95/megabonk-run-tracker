<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megabonk Run Tracker</title>
<style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
    .tab { display: none; padding: 10px; }
    .tabs { display: flex; border-bottom: 1px solid #ccc; flex-shrink: 0; }
    .tabs button { padding: 10px 20px; border: none; border-bottom: 2px solid transparent; background: none; cursor: pointer; }
    .tabs button.active { border-bottom-color: #007BFF; font-weight: bold; }
    label { display: block; margin-top: 10px; }
    input, select { width: 200px; padding: 4px; margin-top: 4px; }
    input[type=checkbox] { width: auto; }
    button { margin-top: 10px; padding: 6px 12px; }
    #progressTable { border-collapse: collapse; width: 100%; }
    #progressTable th, #progressTable td { border: 1px solid #ccc; padding: 6px; text-align: left; vertical-align: top; min-width: 120px; }
    .completed { background-color: #dff3dd; }
    pre { margin: 0; font-family: monospace; }
    table#allRuns { width: 100%; border-collapse: collapse; }
    table#allRuns th, table#allRuns td { border: 1px solid #ccc; padding: 4px; text-align: center; }

    /* Progress Tracker full height */
    #progressTab { flex: 1; min-height: 0; padding: 0; flex-direction: column; }
    #progressControls { padding: 10px; flex-shrink: 0; }
    #progressWrapper { flex: 1; overflow: auto; min-height: 0; padding: 10px; }
</style>
</head>
<body>

<div class="tabs">
    <button class="tabButton active" data-tab="logTab">Log Run</button>
    <button class="tabButton" data-tab="progressTab">Progress Tracker</button>
    <button class="tabButton" data-tab="allRunsTab">All Runs</button>
</div>

<div id="logTab" class="tab" style="display:block;">
    <label>Character:
        <select id="characterSelect"></select>
    </label>
    <label>Map:
        <select id="mapSelect"></select>
    </label>
    <label>Difficulty:
        <select id="difficultySelect"></select>
    </label>
    <label>
        <input type="checkbox" id="successCheckbox"> Successful run?
    </label>
    <label>Time (MM:SS:MS) — optional:
        <input type="text" id="timeInput">
    </label>
    <label>Kills — optional:
        <input type="text" id="killsInput">
    </label>
    <button onclick="submitRun()">Submit Run</button>
    <button onclick="clearTimeKills()">Clear Time/Kills</button>
    <div id="configStats" style="margin-top:12px; background:#f0f0f0; padding:6px;"></div>
</div>

<div id="progressTab" class="tab">
    <div id="progressControls">
        <button onclick="refreshProgress()">Refresh</button>
    </div>
    <div id="progressWrapper">
        <table id="progressTable"></table>
    </div>
</div>

<div id="allRunsTab" class="tab">
    <button onclick="refreshAllRuns()">Refresh Runs</button>
    <button onclick="removeSelectedRun()">Remove Selected Run</button>
    <button onclick="exportRuns()">Export Data</button>
    <button onclick="document.getElementById('importFile').click()">Import Data</button>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importRuns(event)">
    <table id="allRuns">
        <thead>
            <tr>
                <th>Select</th>
                <th>ID</th>
                <th>Character</th>
                <th>Map</th>
                <th>Difficulty</th>
                <th>Success</th>
                <th>Time</th>
                <th>Kills</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
const CHARACTERS = ["Amog","Athena","Bandit","Birdo","Bush","Calcium","CL4NK","Dicehead","Fox","Megachad","Monke","Ninja","Noelle","Ogre","Robinette","Sir Chadwell","Sir Oofie","Spaceman","Tony McZoom","Vlad"];
const MAPS = ["Forest","Desert"];
const DIFFICULTIES = ["Tier 1","Tier 2","Tier 3"];

function getRuns() {
    return JSON.parse(localStorage.getItem('runs')||'[]');
}

function saveRuns(newRuns) {
    localStorage.setItem('runs', JSON.stringify(newRuns));
}

function parseTime(str) {
    if (!str) return null;
    const parts = str.split(":").map(Number);
    if (parts.some(isNaN)) return null;
    if (parts.length === 1) return parts[0];
    if (parts.length === 2) return parts[0]*60 + parts[1];
    if (parts.length === 3) return parts[0]*60 + parts[1] + parts[2]/1000;
    return null;
}

function formatTime(sec) {
    if (sec === null) return "—";
    const total_ms = Math.round(sec*1000);
    const m = Math.floor(total_ms/(60*1000));
    const s = Math.floor((total_ms/1000)%60);
    const ms = total_ms % 1000;
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}:${ms.toString().padStart(3,'0')}`;
}

// Initialize selects
const characterSelect = document.getElementById("characterSelect");
CHARACTERS.forEach(c => characterSelect.add(new Option(c,c)));
const mapSelect = document.getElementById("mapSelect");
MAPS.forEach(m => mapSelect.add(new Option(m,m)));
const difficultySelect = document.getElementById("difficultySelect");
DIFFICULTIES.forEach(d => difficultySelect.add(new Option(d,d)));

function submitRun() {
    const char = characterSelect.value;
    const map = mapSelect.value;
    const diff = difficultySelect.value;
    const success = document.getElementById("successCheckbox").checked;
    const timeStr = document.getElementById("timeInput").value.trim();
    const killsStr = document.getElementById("killsInput").value.trim();

    if (!char || !map || !diff) { alert("Please select character, map and difficulty."); return; }
    const t = parseTime(timeStr);
    if (timeStr && t === null) { alert("Invalid time format."); return; }
    const kills = killsStr ? parseInt(killsStr) : null;
    if (killsStr && isNaN(kills)) { alert("Kills must be an integer."); return; }

    const currentRuns = getRuns();
    currentRuns.push({
        id: Date.now(),
        character: char,
        map: map,
        difficulty: diff,
        success,
        time: timeStr,
        kills: kills || "",
        timestamp: new Date().toISOString()
    });
    saveRuns(currentRuns);
    refreshProgress();
    refreshAllRuns();
    updateConfigStats();
    clearTimeKills();
    alert("Run saved!");
}

function clearTimeKills() {
    document.getElementById("timeInput").value = "";
    document.getElementById("killsInput").value = "";
}

function computeProgress(runs) {
    const prog = {};
    CHARACTERS.forEach(c => MAPS.forEach(m => DIFFICULTIES.forEach(d => {
        prog[`${c}|${m}|${d}`] = {beaten:false,total_runs:0,fastest_success_time:null,fastest_success_kills:null,most_kills_any:null,most_kills_any_time:null,most_kills_success:null,most_kills_success_time:null};
    })));
    runs.forEach(r => {
        const key = `${r.character}|${r.map}|${r.difficulty}`;
        const e = prog[key];
        if (!e) return;
        e.total_runs += 1;
        const kills = r.kills ? parseInt(r.kills) : null;
        const tsec = parseTime(r.time);
        if (r.success) {
            e.beaten = true;
            if (tsec !== null && (e.fastest_success_time===null || tsec<e.fastest_success_time)) {
                e.fastest_success_time = tsec;
                e.fastest_success_kills = kills;
            }
            if (kills !== null && (e.most_kills_success===null || kills>e.most_kills_success)) {
                e.most_kills_success = kills;
                e.most_kills_success_time = tsec;
            }
        }
        if (kills !== null) {
            if (e.most_kills_any===null || kills>e.most_kills_any) {
                e.most_kills_any = kills;
                e.most_kills_any_time = tsec;
            }
        }
    });
    return prog;
}

function refreshProgress() {
    const table = document.getElementById("progressTable");
    table.innerHTML = "";
    const currentRuns = getRuns();
    const prog = computeProgress(currentRuns);

    const header = table.insertRow();
    ["Character", ...MAPS.flatMap(m => DIFFICULTIES.map(d => `${m} | ${d}`))].forEach(h => {
        const th = document.createElement("th"); th.textContent=h; header.appendChild(th);
    });

    CHARACTERS.forEach(c => {
        const row = table.insertRow();
        const charCell = row.insertCell(); charCell.textContent = c;
        MAPS.forEach(m => DIFFICULTIES.forEach(d => {
            const e = prog[`${c}|${m}|${d}`];
            const cell = row.insertCell();
            const text = [
                `Successful?: ${e.beaten ? 'Yes':'No'}`,
                `Total Runs: ${e.total_runs}`,
                `Fastest Successful Run: ${formatTime(e.fastest_success_time)} (${e.fastest_success_kills||'—'} kills)`,
                `Most Kills (Any Run): ${e.most_kills_any||'—'} (${formatTime(e.most_kills_any_time)})`,
                `Most Kills (Successful Run): ${e.most_kills_success||'—'} (${formatTime(e.most_kills_success_time)})`
            ].join("\n");
            cell.innerHTML = `<pre>${text}</pre>`;
            if (e.beaten) cell.classList.add("completed");
        }));
    });
}

function updateConfigStats() {
    const char = characterSelect.value;
    const map = mapSelect.value;
    const diff = difficultySelect.value;
    const currentRuns = getRuns();
    const prog = computeProgress(currentRuns);
    const e = prog[`${char}|${map}|${diff}`];
    if (!e) return;
    const div = document.getElementById("configStats");
    div.innerHTML = [
        `Successful?: ${e.beaten ? 'Yes':'No'}`,
        `Total Runs: ${e.total_runs}`,
        `Fastest Successful Run: ${formatTime(e.fastest_success_time)} (${e.fastest_success_kills||'—'} kills)`,
        `Most Kills (Any Run): ${e.most_kills_any||'—'} (${formatTime(e.most_kills_any_time)})`,
        `Most Kills (Successful Run): ${e.most_kills_success||'—'} (${formatTime(e.most_kills_success_time)})`
    ].join("<br>");
}

function refreshAllRuns() {
    const tbody = document.querySelector("#allRuns tbody");
    tbody.innerHTML = "";
    const currentRuns = getRuns();
    currentRuns.forEach(r => {
        const tr = tbody.insertRow();
        const sel = tr.insertCell(); sel.innerHTML = `<input type="radio" name="selectedRun" value="${r.id}">`;
        [r.id,r.character,r.map,r.difficulty,r.success?'Yes':'No',r.time,r.kills||"",r.timestamp].forEach(v => { tr.insertCell().textContent=v; });
    });
}

function removeSelectedRun() {
    const sel = document.querySelector("#allRuns input[name='selectedRun']:checked");
    if (!sel) { alert("Select a run to remove."); return; }
    const currentRuns = getRuns().filter(r=>r.id!=sel.value);
    saveRuns(currentRuns);
    refreshAllRuns();
    refreshProgress();
    updateConfigStats();
    alert("Run removed!");
}

function exportRuns() {
    const currentRuns = getRuns();
    const dataStr = JSON.stringify(currentRuns, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `megabonk-runs-${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function importRuns(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const importedRuns = JSON.parse(e.target.result);
            if (!Array.isArray(importedRuns)) {
                alert("Invalid file format. Expected an array of runs.");
                return;
            }
            
            const confirm = window.confirm(`Import ${importedRuns.length} runs? This will replace your current data.`);
            if (confirm) {
                saveRuns(importedRuns);
                refreshAllRuns();
                refreshProgress();
                updateConfigStats();
                alert("Runs imported successfully!");
            }
        } catch (error) {
            alert("Error reading file: " + error.message);
        }
        event.target.value = ''; // Reset file input
    };
    reader.readAsText(file);
}

// Tab switching
document.querySelectorAll(".tabButton").forEach(btn => btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(t=>t.style.display="none");
    document.querySelectorAll(".tabButton").forEach(b=>b.classList.remove("active"));
    const targetTab = document.getElementById(btn.dataset.tab);
    targetTab.style.display = targetTab.id === "progressTab" ? "flex" : "block";
    btn.classList.add("active");
}));

// Auto update stats when selects change
[characterSelect, mapSelect, difficultySelect].forEach(sel => sel.addEventListener("change", updateConfigStats));
updateConfigStats();
refreshProgress();
refreshAllRuns();
</script>
<footer style="
    text-align: center;
    background-color: #ccffcc;
    padding: 10px 0;
    font-size: 14px;
    margin-top: 20px;
">
    Donations are appreciated but not required! 
    <a href="https://www.paypal.me/benrobart" target="_blank">Donate via PayPal</a>
</footer>

</body>
</html>
